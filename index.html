<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>看得見的聲音</title>
<meta name="description" content="科普列車現場用克拉尼圖形訊號源：不鏽鋼 25×25 cm、0.8 mm 板，第2～8模態播放">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="topbar">
  <h1>看得見的聲音</h1>
  <p class="plate-spec">不鏽鋼板　25 × 25 cm　厚 0.8 mm</p>
  <button id="btn-ref" type="button" class="ref-toggle" aria-haspopup="dialog">對照圖</button>
  <button id="btn-adjust" type="button" class="adjust-toggle" aria-expanded="false" aria-controls="adjust-panel">調整</button>
</header>

<main id="app">

  <div class="now-playing" id="now-playing">
    <span class="now-playing-label">目前頻率</span>
    <span class="now-playing-freq" id="out-freq">— Hz</span>
  </div>

  <section class="mode-grid" id="mode-grid" aria-label="模態選擇">
    <!-- 按鈕由 js/main.js 動態產生 -->
  </section>

  <section class="adjust-panel" id="adjust-panel" aria-label="頻率微調" hidden>
    <div class="adjust-head">
      <h2>頻率微調</h2>
      <button id="btn-adjust-reset" type="button" class="adjust-reset">恢復預設</button>
    </div>
    <div class="adjust-list" id="adjust-list">
      <!-- 由 js/main.js 動態產生 -->
    </div>
    <p class="adjust-note">調整值會儲存在本機瀏覽器；播放中調整會即時套用。</p>
  </section>

  <section class="transport">
    <button id="btn-stop" type="button" class="stop-btn" disabled>■ 停止</button>
    <div class="volume-control">
      <label for="rng-volume">音量</label>
      <input type="range" id="rng-volume" min="0" max="0.85" step="0.01">
      <span id="out-volume" class="mono">30%</span>
    </div>
  </section>

  <p class="hint">點擊模態按鈕即播放對應頻率　·　按空白鍵可立即停止</p>

</main>

<div class="ref-overlay" id="ref-overlay" role="dialog" aria-modal="true" aria-label="模態對照圖" hidden>
  <div class="ref-box">
    <button id="btn-ref-close" type="button" class="ref-close">關閉</button>
    <img src="./img/對照圖.png" alt="第2～8模態：模擬節線圖與實驗克拉尼圖形對照">
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
